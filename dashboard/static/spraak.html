<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — spraakpaneel</title>
<link rel="stylesheet" href="/styles.css?v=24.4">
<script src="/spraak.js?v=24.4" defer></script>
</head>
<body class="lokaal">
  <main class="dialoog proef spraakpaneel" aria-labelledby="titel">
    <div class="dialoog-kop">
      <div class="dialoog-titel" id="titel">JARVIS — SPRAAKPANEEL</div>
    </div>
    <div class="dialoog-uitleg">De iPad is de microfoon van JARVIS zolang deze pagina open is. Houd hem open in <b>Safari</b>, met het scherm aan (iPad aan de lader).</div>

    <div class="spraak-staat" id="staat" aria-live="polite">Uit</div>
    <div class="spraak-jarvis" id="jarvis"></div>
    <div class="spraak-route" id="route"></div>
    <div class="bar proef-niveau"><div id="niveau"></div></div>
    <div class="dialoog-uitleg" id="uitleg">Tik op <i>Start luisteren</i>. Zeg daarna gewoon <b>“Hey JARVIS”</b>.</div>
    <label class="spraak-optie"><input type="checkbox" id="spreker" checked> Antwoord van JARVIS op de iPad laten horen</label>

    <div class="melding-fout" id="fout" role="alert"></div>
    <div class="dialoog-knoppen">
      <button type="button" class="knop primair" id="aanuit">Start luisteren</button>
    </div>
  </main>
</body>
</html>
