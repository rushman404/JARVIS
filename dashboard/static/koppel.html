<!doctype html>

  <main class="dialoog" aria-labelledby="titel">

      <div class="dialoog-titel" id="titel">KOPPELCODE VOOR DE IPAD</div>
    </div>

    <div class="grote-code" id="code" aria-live="polite">— — — —</div>
    <div class="dialoog-uitleg" id="geldig"></div>
    <div class="melding-fout" id="fout" role="alert"></div>
    <div class="dialoog-knoppen">
      <button type="button" class="knop primair" id="nieuw">Nieuwe koppelcode</button>
    </div>
    <div class="dialoog-uitleg">Certificaat voor de iPad: <a href="/profiel.mobileconfig">profiel downloaden</a>.</div>
